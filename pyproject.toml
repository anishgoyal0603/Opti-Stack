[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=opti_stack --cov-report=term-missing --cov-fail-under=70"

[tool.coverage.run]
omit = ["ui/*", "tests/*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opti-stack"
version = "1.0.0"
description = "A multi-agent system that rewrites slow Python and proves the rewrite is correct."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Anish Goyal" }]
dependencies = [
    "streamlit>=1.38,<2.0",
    "google-genai>=1.0,<3.0",
    "pandas>=2.0,<3.0",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "pytest-cov>=5.0,<6.0"]

[project.scripts]
opti-stack = "opti_stack.cli:main"

[project.urls]
Repository = "https://github.com/anishgoyal0603/Opti-Stack"

[tool.setuptools.packages.find]
include = ["opti_stack*"]